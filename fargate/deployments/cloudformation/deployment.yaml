AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploys an ECS Fargate task with an S3 downloader sidecar.'

Metadata:
  Version: "1.1.0"
  Description: "Added extra ephemeral disk space configuration"


Parameters:
  SimulationBucketName:
    Type: String
    Default: my-test-bucket
    Description: S3 bucket containing simulation archives.

  SimulationS3EndpointUrl:
    Type: String
    Default: ''
    Description: Optional S3 endpoint reachable from the task container, for example LocalStack.

  AppImageUri:
    Type: String
    Description: Image URI for the Simer application.
    Default: 'localhost:4566/dse-simer:latest'

  SidecarImageUri:
    Type: String
    Description: Image URI for the S3 download and extraction sidecar.
    Default: 'localhost:4566/dse-simer-fetcher:latest'

Conditions:
  HasSimulationS3Endpoint: !Not [!Equals [!Ref SimulationS3EndpointUrl, '']]

Resources:
  # 1. Create the ECS Cluster automatically
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: customer-processing-cluster

  # 2. Create the CloudWatch Log Group for console outputs
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: '/ecs/customer-sidecar-processing'
      RetentionInDays: 7

  # 3. Create the IAM Execution Role (To pull images & write logs)
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # 4. Create the IAM Task Role (Allows the sidecar to read from their S3)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CustomerS3ReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SimulationBucketName}'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SimulationBucketName}/*'

  # 5. The Unified Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: customer-s3-processing-task
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      EphemeralStorage:
        SizeInGiB: 30
      Volumes:
        - Name: shared-data
      ContainerDefinitions:
        - Name: s3-downloader-sidecar
          Image: !Ref SidecarImageUri
          Essential: false
          Cpu: 256
          Memory: 512
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref 'AWS::Region'
            - !If
              - HasSimulationS3Endpoint
              - Name: AWS_ENDPOINT_URL
                Value: !Ref SimulationS3EndpointUrl
              - !Ref AWS::NoValue
          EntryPoint:
            - /bin/sh
            - -c
          Command:
            - >-
              set -eu;
              : "${S3_TARGET_ZIP:?S3_TARGET_ZIP is required}";
              aws s3 cp "$S3_TARGET_ZIP" /tmp/archive.zip;
              unzip -q /tmp/archive.zip -d /mnt/shared
          MountPoints:
            - SourceVolume: shared-data
              ContainerPath: /mnt/shared
              ReadOnly: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: downloader
        - Name: dse-simer-container
          Image: !Ref AppImageUri
          Cpu: 256
          Memory: 512
          Essential: true
          DependsOn:
            - ContainerName: s3-downloader-sidecar
              Condition: SUCCESS
          MountPoints:
            - SourceVolume: shared-data
              ContainerPath: /sim
              ReadOnly: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: app

Outputs:
  ClusterName:
    Value: !Ref EcsCluster
    Description: Provide this cluster name to run tasks.
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
    Description: Provide this Task Definition ARN to run tasks.