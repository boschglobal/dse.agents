services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: ministack_sandbox
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MINISTACK_ACCOUNT_ID: ${MINISTACK_ACCOUNT_ID:-000000000000}
      SIMULATION_BUCKET_NAME: ${SIMULATION_BUCKET_NAME:-my-test-bucket}
    volumes:
      - ./init-hooks:/docker-entrypoint-initaws.d/ready.d:ro
      - /var/run/docker.sock:/var/run/docker.sock