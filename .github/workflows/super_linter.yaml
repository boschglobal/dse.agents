---
name: Super Linter

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
    types: [assigned, opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  super_linter:
    name: Lint Code Base
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: super-linter/super-linter/slim@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Enabled validators.
          VALIDATE_DOCKERFILE: true
          VALIDATE_GO: true
          VALIDATE_MARKDOWN: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_YAML: true

          # Keep generated/vendor content out of linting if those appear later.
          FILTER_REGEX_EXCLUDE: (^|/)vendor/.*|(^|/)licenses/.*
